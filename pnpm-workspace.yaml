packages:
  - packages/*

# One version of each tool for the whole workspace. Packages refer to these
# with `catalog:`, and pnpm writes the real ranges into published manifests.
catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@biomejs/biome": ^2.6.5
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@commitlint/lint": ^21.2.4
  "@commitlint/load": ^21.2.4
  "@commitlint/types": ^21.2.3
  "@microsoft/api-extractor": ^7.60.1
  "@secretlint/node": ^13.1.0
  "@secretlint/secretlint-rule-preset-recommend": ^13.1.0
  "@types/node": ^24.19.2
  "@types/picomatch": ^4.0.3
  "@vitest/browser-playwright": 5.1.0
  dependency-cruiser: ^18.7.2
  husky: ^9.1.7
  lint-staged: ^17.6.0
  picomatch: ^4.0.7
  playwright: ^1.64.1
  postcss-selector-parser: ^7.1.7
  postcss-value-parser: ^4.2.0
  postcss: ^8.5.31
  publint: ^0.3.25
  secretlint: ^13.1.0
  stylelint: ^18.0.0
  typescript: ^6.0.3
  vite: ^8.3.6
  vitest: ^5.1.0

# Supply-chain hardening (ADR 0012).
# Dependency install scripts are blocked unless allowlisted here.
allowBuilds: {}
# Fail the install when an unapproved package wants to run a build script.
strictDepBuilds: true
# Don't resolve versions published less than a day ago.
minimumReleaseAge: 1440
# Refuse a version with weaker publish provenance than an earlier one.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true
